# BUILD
# Poetry https://python-poetry.org/docs/pyproject/
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "dmc-view"
version = "0.3.3"
description = "Digital Magnetic Compass View"
authors = [
   {name="Iso"}, 
   {name="Alan"}
]
maintainers = [{name="Iso"}, {name="Alan"}] # must be an object
license = {text = "AGPL-3.0-only"}
readme = {file = "README.rst", content-type = "text/x-rst"}

homepage = "https://github.com/iso-techdev/dmc-view"
repository = "https://github.com/iso-techdev/dmc-view"
documentation = "https://dmc-view.readthedocs.io/"

keywords = [
    "digital magnetic view", "dmc",
]

requires-python = ">=3.13"

# Troves classifier see https://pypi.org/classifiers/
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Natural Language :: English",
    "Operating System :: Unix",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment",
]


# PyPi url links, that appear in 'Project Links' section
urls."Bug Tracker" = "https://github.com/iso-techdev/dmc-view/issues"
urls."CI: Github Actions" = "https://github.com/iso-techdev/dmc-view/actions"
urls.Documentation = "https://dmc-view.readthedocs.io/"
urls."Source Code" = "https://github.com/iso-techdev/dmc-view"
urls.Changelog = "https://github.com/iso-techdev/dmc-view/blob/master/CHANGELOG.rst"
urls."Code of Conduct" = "https://github.com/iso-techdev/dmc-view/blob/master/CONTRIBUTING.md"



### Dependency Constraints, aka Requirements ###
# see https://python-poetry.org/docs/dependency-specification/#multiple-constraints-project
dependencies = [
  "pyside6 (<=6.11.2); python_version <'3.15' and python_version >= '3.10'", # check this https://pypi.org/project/PySide6/  to the right menu "Requires" 
  "matplotlib (>=3.10.1); python_version>='3.10' and python_version <='3.13'" # see https://github.com/matplotlib/matplotlib/blob/v3.10.1/pyproject.toml
]

## optional dependency for test or other purpose 
## Install in edit mode with the test dependencies 
## $ pip install -e .  dmc-view[test]
[project.optional-dependencies]
test = [
  "pytest (>=8.4.0); python_version >='3.9' and python_version <='3.14'",
  "pytest-cov (>=6); python_version >='3.9' and python_version <='3.13'",
  "pytest-mock (>=3.14.0); python_version >='3.9' and python_version <='3.14'",
  "pytest-qt (>=4.5.0); python_version >='3.9' and python_version <='3.13'",

]
docs =[
   "Sphinx (<=8.2.3);  python_version >='3.11' and python_version <='3.14'",
   "sphinx-autodoc-typehints (<=3.2.0); python_version >='3.11' and python_version <='3.14'",
   "sphinx-rtd-theme (<=3.0.2);  python_version >='3.8' and python_version <='3.14'",
   "sphinxcontrib-spelling (<=8.0.1);  python_version >='3.10' and python_version <='3.14'",
   "sphinx-autobuild (==2024.10.3);  python_version >='3.9' and python_version <='3.14'",
   "sphinx-inline-tabs (==2023.4.21); python_version >='3.8' and python_version <='3.14'",
   "sphinxcontrib-mermaid (<=1.0.0);  python_version >='3.8' and python_version <='3.14'"
]


# Information required for building (sdist/wheel)
[tool.poetry]
packages = [
    { include = "dmcview", from = "src" },
]

include = [
    { path = "tests", format = "sdist" },
    { path = "docs/**/*.rst", format = "sdist" },
    { path = "docs/conf.py", format = "sdist" },
    { path = "src/**/*.typed", format = "sdist" },
    { path = "src/stubs/*.pyi", format = "sdist" },
    "pyproject.toml",
    "LICENSE",
    "README.rst",
    "CONTRIBUTING.md",
    "CHANGELOG.rst",
]

exclude = [
    "docs/*",
    "requirements/*",
    "scripts/*.py",
    "tox.ini",
    ".circleci/config.yml",
    ".coveragerc",
    ".DS_Store",
    ".gitignore",
    ".prospector.yml",
    ".pylintrc",
    ".readthedocs.yml",
    ".scrutinizer.yml",
    ".travis.yml"
]



#https://python-poetry.org/docs/pyproject/#scripts
# we will have the dmcview script installed which will execute the main function in the console module in the dmcview package.
[project.scripts]
dmcview = 'dmcview.cli:main'
 

##############
# TOOLS
# CONFIG PLACE
##############

# RUFF is a fast Python linter, written in Rust. 
#It can be used as a replacement for Flake8, Pyflakes, pycodestyle, and other linters. 
#It also includes some additional checks and features that are not available in those tools.
# https://docs.astral.sh/ruff/configuration/
# $ ruff check
[tool.ruff]
target-version = "py310" 
src = ["src/dmcview", "tests"]
exclude = ["docs/", "scripts"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]


[tool.ruff.lint.isort]
known-first-party = ["dmcview"]

[tool.ruff.format]
# Use black-compatible formatting
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.pydocstyle]
convention = "google"


#*********************************************************************
# mypy configuration moved from mypy.ini to pyproject.toml
# config file doc:https://mypy.readthedocs.io/en/stable/config_file.html
# $ mypy ./src/mainpackage
#**********************************************************************
[tool.mypy]
# Global options:
warn_return_any = true
warn_unused_configs = true

# mypy per-module options:
[[tool.mypy.overrides]]
module = "dmcview.*"
disallow_untyped_defs = true


#*********************************************************************
# Pytest configuration moved from pytest.ini to pyproject.toml
# config file doc:https://docs.pytest.org/en/stable/reference/customize.html
# QT fixture see https://pytest-qt.readthedocs.io/en/latest/intro.html
#**********************************************************************#
[tool.pytest]
minversion = "9.0"
addopts = ["--strict-markers"]
pythonpath=["src"]
testpaths = ["tests"]
#required_plugins=["pytest-qt"]


#*********************************************************************
# Test Coverage configuration moved from .coveragerc to pyproject.toml
# config file doc:https://coverage.readthedocs.io/en/7.15.4/config.html
#**********************************************************************
# $ coverage run -m pytest
[tool.coverage.run]
source = ["dmcview"]
parallel = true
# branch is the if else statement 
branch = true

[tool.coverage.report]
fail_under=20 # threshold for test coverage, if below this number the test will fail
skip_covered = false
show_missing = true
precision = 2
omit = [    
    "tests/*",
    "*/__init__.py"
]

exclude_lines = [
    "raise NotImplementedError",
    "raise NotImplemented"
]
ignore_errors = false


[tool.coverage.html]
directory = "coverage_html_report"
